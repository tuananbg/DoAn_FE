<form nz-form [formGroup]="createForm" (keyup.enter)="handleOkModal()" style="margin: 0 24px;">
  <!-- Mã nhân viên -->
  <nz-form-item>
    <nz-form-label [nzSpan]="6">Mã nhân viên</nz-form-label>
    <nz-form-control [nzSpan]="18">
      <input nz-input formControlName="employeeCode"  />
    </nz-form-control>
  </nz-form-item>

  <!-- Họ và tên -->
  <nz-form-item>
    <nz-form-label [nzSpan]="6">Họ và tên</nz-form-label>
    <nz-form-control [nzSpan]="18">
      <input nz-input formControlName="fullName"  />
    </nz-form-control>
  </nz-form-item>

  <!-- Email -->
  <nz-form-item>
    <nz-form-label [nzSpan]="6" [nzRequired]="true">Email</nz-form-label>
    <nz-form-control [nzSpan]="18">
      <input nz-input formControlName="email" />
    </nz-form-control>
  </nz-form-item>

  <!-- Vai trò -->
  <nz-form-item>
    <nz-form-label [nzSpan]="6" [nzRequired]="true">Vai trò</nz-form-label>
    <nz-form-control [nzSpan]="18">
      <nz-select
        nzMode="multiple"
        nzPlaceHolder="Chọn vai trò người dùng"
        formControlName="roles"
        [nzMaxTagCount]="3"
        [nzMaxTagPlaceholder]="tagPlaceHolder"
        class="w-100"
      >
        <nz-option *ngFor="let item of listOfOption" [nzLabel]="item.name" [nzValue]="item.code"></nz-option>
      </nz-select>
      <ng-template #tagPlaceHolder let-selectedList>
        và {{ selectedList.length }} vai trò khác
      </ng-template>
    </nz-form-control>
  </nz-form-item>
</form>

<!-- Footer -->
<div *nzModalFooter>
  <div class="modal__footer-wrapper d-flex justify-content-center">
    <app-button-cancel [isIcon]="true" [popConfirm]="false" (clickCancel)="handleCancelModal()"></app-button-cancel>
    <app-button-save [loading]="isLoading" [isIcon]="true" [text]="isUpdate ? 'Cập nhật' : 'Thêm mới'" (clickSave)="handleOkModal()"></app-button-save>
  </div>
</div>
