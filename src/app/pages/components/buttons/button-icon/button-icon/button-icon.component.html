<button (click)="onClickAction()" nz-button [nzType]="buttonType" [nzSize]="buttonSize" [disabled]="disabled"
        nzTooltipTitle="{{tooltipTitle? tooltipTitle :''}}" nzTooltipPlacement="{{TOOLTIP.PLACEMENT_TOP}}"
        nz-tooltip>

  <ng-container *ngIf="isContinue">
    <i nz-icon nzType="play-circle" nzTheme="fill" class="icon__add-user"></i>
  </ng-container>

  <ng-container *ngIf="isEdit">
    <i nz-icon nzType="edit" nzTheme="outline" class="icon__edit"></i>
  </ng-container>


  <ng-container *ngIf="isViewDetail">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path

        fill="#686C6F"/>
    </svg>
  </ng-container>

    <svg width="16" height="20" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M1.11111 17.7778C1.11111 19 2.11111 20 3.33333 20H12.2222C13.4444 20 14.4444 19 14.4444 17.7778V6.66667C14.4444 5.44444 13.4444 4.44444 12.2222 4.44444H3.33333C2.11111 4.44444 1.11111 5.44444 1.11111 6.66667V17.7778ZM4.63333 9.07778C5.06667 8.64445 5.76667 8.64445 6.2 9.07778L7.77778 10.6556L9.35556 9.07778C9.78889 8.64445 10.4889 8.64445 10.9222 9.07778C11.3556 9.51111 11.3556 10.2111 10.9222 10.6444L9.34444 12.2222L10.9222 13.8C11.3556 14.2333 11.3556 14.9333 10.9222 15.3667C10.4889 15.8 9.78889 15.8 9.35556 15.3667L7.77778 13.7889L6.2 15.3667C5.76667 15.8 5.06667 15.8 4.63333 15.3667C4.2 14.9333 4.2 14.2333 4.63333 13.8L6.21111 12.2222L4.63333 10.6444C4.2 10.2222 4.2 9.51111 4.63333 9.07778ZM11.6667 1.11111L10.8778 0.322222C10.6778 0.122222 10.3889 0 10.1 0H5.45555C5.16667 0 4.87778 0.122222 4.67778 0.322222L3.88889 1.11111H1.11111C0.5 1.11111 0 1.61111 0 2.22222C0 2.83333 0.5 3.33333 1.11111 3.33333H14.4444C15.0556 3.33333 15.5556 2.83333 15.5556 2.22222C15.5556 1.61111 15.0556 1.11111 14.4444 1.11111H11.6667Z"
        fill="black"/>
    </svg>
    <!--    <i nz-icon nzType="delete" nzTheme="outline"></i>-->
  </ng-container>

  <ng-container *ngIf="isAddUser">
    <i class="icon__add-user" nz-icon nzType="usergroup-add" nzTheme="outline"></i>
  </ng-container>

  <ng-container *ngIf="isUploadFile">

  </ng-container>

  </ng-container>

      <path
        d="M14.0736 7.05882H11.1107V1.17647C11.1107 0.529412 10.5643 0 9.89643 0H7.10357C6.43571 0 5.88929 0.529412 5.88929 1.17647V7.05882H2.92643C1.84571 7.05882 1.29929 8.32941 2.06429 9.07059L7.63786 14.4706C8.11143 14.9294 8.87643 14.9294 9.35 14.4706L14.9236 9.07059C15.6886 8.32941 15.1543 7.05882 14.0736 7.05882ZM0 18.8235C0 19.4706 0.546429 20 1.21429 20H15.7857C16.4536 20 17 19.4706 17 18.8235C17 18.1765 16.4536 17.6471 15.7857 17.6471H1.21429C0.546429 17.6471 0 18.1765 0 18.8235Z"

  </ng-container>

    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path
        d="M10 0C4.47 0 0 4.47 0 10C0 15.53 4.47 20 10 20C15.53 20 20 15.53 20 10C20 4.47 15.53 0 10 0ZM14.3 14.3C13.91 14.69 13.28 14.69 12.89 14.3L10 11.41L7.11 14.3C6.72 14.69 6.09 14.69 5.7 14.3C5.31 13.91 5.31 13.28 5.7 12.89L8.59 10L5.7 7.11C5.31 6.72 5.31 6.09 5.7 5.7C6.09 5.31 6.72 5.31 7.11 5.7L10 8.59L12.89 5.7C13.28 5.31 13.91 5.31 14.3 5.7C14.69 6.09 14.69 6.72 14.3 7.11L11.41 10L14.3 12.89C14.68 13.27 14.68 13.91 14.3 14.3Z"
        fill="#686C6F"/>
    </svg>
  </ng-container>

  <ng-container *ngIf="isRenew">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
      <path fill="#1976d2" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6 6.001 6.001 0 0 1-5.917-5H4a8 8 0 1 0 8-8Z"/>
    </svg>
  </ng-container>


  <ng-container *ngIf="isAddFile">
    <i class="icon__add-file" nz-icon nzType="file-add" nzTheme="outline"></i>
  </ng-container>

    <svg width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M16.33 8V7.5H15.83H14.1035C14.1033 7.49819 14.1034 7.49682 14.1035 7.49616L14.1038 7.49528C14.104 7.49503 14.1052 7.49266 14.1093 7.48844L16.7968 4.72249L19.4942 7.49844L19.4941 7.49848L19.4956 7.5H17.7734H17.2734V8C17.2734 12.1575 14.0052 15.5 10 15.5C9.05562 15.5 8.14956 15.3131 7.32657 14.9688L7.32511 14.9681C7.00458 14.8352 6.90914 14.3985 7.16179 14.1384C7.30252 13.9936 7.48527 13.9634 7.6162 14.0193C8.35259 14.3377 9.1684 14.5 10 14.5C13.5058 14.5 16.33 11.5725 16.33 8ZM3.66997 8V8.5H4.16997H5.89885C5.89909 8.50094 5.89927 8.50183 5.89939 8.50267L3.20315 11.2775L0.505838 8.50156L0.505883 8.50152L0.50436 8.5H2.22662H2.72662V8C2.72662 3.8425 5.9948 0.5 10 0.5C10.9444 0.5 11.8504 0.68687 12.6734 1.03125L12.6749 1.03186C12.9954 1.16479 13.0909 1.60154 12.8382 1.86156C12.6975 2.00639 12.5147 2.03655 12.3838 1.98068C11.6474 1.66232 10.8316 1.5 10 1.5C6.49417 1.5 3.66997 4.4275 3.66997 8Z"

      4.03567 5.28579 5.28591C4.03555 6.53616 3.33317 8.23185 3.33317 9.99996C3.33317 11.7681 4.03555 13.4638 5.28579 14.714C6.53603 15.9642

  <ng-container *ngIf="isLink">
    <i nz-icon class="icon__add-user">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path
          d="M6.188 8.719c.439-.439.926-.801 1.444-1.087 2.887-1.591 6.589-.745 8.445 2.069l-2.246 2.245c-.644-1.469-2.243-2.305-3.834-1.949-.599.134-1.168.433-1.633.898l-4.304 4.306c-1.307 1.307-1.307 3.433 0 4.74 1.307 1.307 3.433 1.307 4.74 0l1.327-1.327c1.207.479 2.501.67 3.779.575l-2.929 2.929c-2.511 2.511-6.582 2.511-9.093 0s-2.511-6.582 0-9.093l4.304-4.306zm6.836-6.836l-2.929 2.929c1.277-.096 2.572.096 3.779.574l1.326-1.326c1.307-1.307 3.433-1.307 4.74 0 1.307 1.307 1.307 3.433 0 4.74l-4.305 4.305c-1.311 1.311-3.44 1.3-4.74 0-.303-.303-.564-.68-.727-1.051l-2.246 2.245c.236.358.481.667.796.982.812.812 1.846 1.417 3.036 1.704 1.542.371 3.194.166 4.613-.617.518-.286 1.005-.648 1.444-1.087l4.304-4.305c2.512-2.511 2.512-6.582.001-9.093-2.511-2.51-6.581-2.51-9.092 0z"
          fill="#686C6F"/>
      </svg>
    </i>
  </ng-container>

  <ng-container *ngIf="isUser">
    <i class="icon__add-user" nz-icon nzType="user" nzTheme="outline"></i>
  </ng-container>
  <ng-container *ngIf="isFunc">
    <i class="icon__add-user" nz-icon nzType="apartment" nzTheme="outline"></i>
  </ng-container>
  <ng-container *ngIf="isPause">
    <i nz-icon nzType="pause-circle" nzTheme="fill" class="icon__add-user"></i>
  </ng-container>

  <ng-container *ngIf="isLock">
    <i nz-icon nzType="stop" nzTheme="twotone" [nzTwotoneColor]="'#ff4d4f'" class="icon__disabled"></i>
  </ng-container>

  <ng-container *ngIf="isUnlock">
    <i nz-icon nzType="unlock" nzTheme="twotone" [nzTwotoneColor]="'#52c41a'" class="icon__add-user"></i>
  </ng-container>


  <ng-container *ngIf="isAction">
    <i nz-icon nzType="dash" nzTheme="outline" class="icon__add-user"></i>
  </ng-container>
  <ng-container *ngIf="isBars">
    <i nz-icon nzType="bars" nzTheme="outline" class="icon__add-user"></i>
  </ng-container>
  <ng-container *ngIf="isCheckCircle">
    <i nz-icon nzType="check" nzTheme="outline" class="icon__add-user"></i>
  </ng-container>
  <ng-container *ngIf="isUnCheckCircle">
    <i nz-icon nzType="close" nzTheme="outline" class="icon__add-user"></i>
  </ng-container>
</button>
